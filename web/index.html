<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SNN Sandbox</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <h1>SNN Sandbox</h1>
          <p id="deviceLine">Connecting...</p>
        </div>
        <div class="actions">
          <button id="startBtn" class="primary">Start</button>
          <button id="stopBtn">Stop</button>
          <button id="stepBtn">Step</button>
          <button id="resetBtn">Reset</button>
          <button id="saveBtn">Save</button>
        </div>
      </section>

      <section class="control-strip">
        <label>
          Speed
          <input id="speedInput" type="range" min="1" max="128" value="8" />
          <span id="speedValue">8</span>
        </label>
        <label>
          Saved state
          <select id="stateSelect"></select>
        </label>
        <button id="loadBtn">Load</button>
      </section>

      <section class="metrics-grid">
        <article>
          <span>Training accuracy</span>
          <strong id="accuracy">0%</strong>
        </article>
        <article>
          <span>Eval accuracy</span>
          <strong id="evalAccuracy">0%</strong>
        </article>
        <article>
          <span>Trials</span>
          <strong id="trials">0</strong>
        </article>
        <article>
          <span>Last result</span>
          <strong id="lastResult">-</strong>
        </article>
      </section>

      <section class="workspace">
        <div class="panel network-panel">
          <div class="panel-title">
            <h2>Network</h2>
            <span id="architecture">4 -> 96 -> 3</span>
          </div>
          <canvas id="networkCanvas" width="720" height="360"></canvas>
        </div>
        <div class="panel">
          <div class="panel-title">
            <h2>Spike raster</h2>
            <span>latest cache</span>
          </div>
          <canvas id="rasterCanvas" width="720" height="360"></canvas>
        </div>
        <div class="panel">
          <div class="panel-title">
            <h2>Hidden -> output weights</h2>
            <span>readout STDP</span>
          </div>
          <canvas id="weightsCanvas" width="720" height="360"></canvas>
        </div>
        <div class="panel">
          <div class="panel-title">
            <h2>Evaluation</h2>
            <span>all patterns</span>
          </div>
          <div id="evalList" class="eval-list"></div>
          <canvas id="confusionCanvas" width="360" height="260"></canvas>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
